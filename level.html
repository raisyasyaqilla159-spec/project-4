<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Level - Red Ball Color Blocks</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>
</head>
<body>
    <header class="navbar">
        <h2>🔴 Red Ball Color Blocks</h2>
        <a href="dashboard.html" class="btn secondary">Dashboard</a>
    </header>

    <main class="level-container">
        <h1>Pilih Level</h1>
        <p>Selesaikan level untuk membuka tantangan berikutnya.</p>

        <div class="level-grid">
            <button class="level-card" data-level="1">
                <span>🔴</span>
                <strong>Level 1</strong>
                <small></small>
            </button>

            <button class="level-card" data-level="2">
                <span>🔵</span>
                <strong>Level 2</strong>
                <small></small>
            </button>

            <button class="level-card" data-level="3">
                <span>🟢</span>
                <strong>Level 3</strong>
                <small></small>
            </button>

            <button class="level-card" data-level="4">
                <span>🟡</span>
                <strong>Level 4</strong>
                <small></small>
            </button>

            <button class="level-card" data-level="5">
                <span>🟣</span>
                <strong>Level 5</strong>
                <small></small>
            </button>
        </div>

        <a href="dashboard.html" class="back-link">← Kembali ke Dashboard</a>
    </main>
</body>
</html>
